
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BREMOH BEAUTY GLOW | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#211821;--panel:#302331;--pink:#e8b9c7;--gold:#c5a15a;--white:#fff9f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font:15px Arial,sans-serif;padding:25px}
main{max-width:850px;margin:35px auto}
h1{color:var(--pink);letter-spacing:2px}
h2{color:var(--gold)}
.card{background:var(--panel);padding:24px;border-radius:16px;margin:18px 0}
input,select,button{width:100%;padding:13px;margin:8px 0;border:0;border-radius:8px;font:inherit}
button{background:var(--gold);color:#211821;font-weight:bold;cursor:pointer}
button.delete{background:#9b455b;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
small,.muted{color:#d9cbd5}
#message{padding:12px 0;color:var(--pink)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.photo{background:#211821;border-radius:12px;padding:10px;overflow:hidden}
.photo img{width:100%;height:190px;object-fit:cover;border-radius:8px}
.photo button{padding:10px}
.hidden{display:none}
a{color:var(--pink)}
</style>
</head>
<body>
<main>
<h1>BREMOH BEAUTY GLOW</h1>
<p class="muted">Private photo management dashboard</p>

<section id="login" class="card">
<h2>Administrator login</h2>
<p>Sign in with your authorised administrator account.</p>
<form id="loginForm">
<input id="email" type="email" placeholder="Administrator email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">SIGN IN</button>
</form>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
<h2>Manage beauty photos</h2>
<button id="logout" style="width:auto">Sign out</button>
</div>
<p class="muted">Upload a photo, choose its service, and it will appear in the public website gallery.</p>
<form id="uploadForm">
<label>Photo title</label>
<input id="title" placeholder="e.g. Soft glam makeup" required>
<label>Service category</label>
<select id="category" required>
<option value="">Choose category</option>
<option>Manicure</option>
<option>Pedicure</option>
<option>Acrylic nails</option>
<option>Gel nails</option>
<option>Nail art</option>
<option>Makeup</option>
<option>Bridal makeup</option>
<option>Lashes</option>
</select>
<label>Choose photo</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required>
<button id="uploadButton" type="submit">UPLOAD PHOTO</button>
</form>
<div id="message" role="status"></div>
</div>

<div class="card">
<h2>Uploaded photos</h2>
<div id="photos" class="gallery"></div>
</div>
</section>
<p class="muted"><a href="index.html">← Return to website</a></p>
</main>

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const loginSection = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");

function say(text){ message.textContent = text; }

async function checkSession(){
  const {data:{session}} = await db.auth.getSession();
  if(session && session.user.id === OWNER_ID){
    loginSection.classList.add("hidden");
    dashboard.classList.remove("hidden");
    await loadPhotos();
  }else{
    dashboard.classList.add("hidden");
    loginSection.classList.remove("hidden");
    if(session) await db.auth.signOut();
  }
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  say("Signing in…");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const {data,error} = await db.auth.signInWithPassword({email,password});
  if(error){say("Login failed: "+error.message);return;}
  if(data.user.id !== OWNER_ID){
    await db.auth.signOut();
    say("This account is not authorised to manage this website.");
    return;
  }
  say("Welcome. Loading your photos…");
  await checkSession();
});

document.getElementById("logout").addEventListener("click",async()=>{
  await db.auth.signOut();
  dashboard.classList.add("hidden");
  loginSection.classList.remove("hidden");
  say("You have signed out.");
});
