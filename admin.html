
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BREMOH BEAUTY GLOW | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #211821;
  --panel: #302331;
  --pink: #e8b9c7;
  --gold: #c5a15a;
  --white: #fff9f6;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: var(--bg);
  color: var(--white);
  font-family: Arial, sans-serif;
}

main {
  max-width: 900px;
  margin: 35px auto;
}

h1 { color: var(--pink); letter-spacing: 2px; }
h2 { color: var(--gold); }

.card {
  background: var(--panel);
  padding: 24px;
  border-radius: 16px;
  margin: 20px 0;
}

input, select, button {
  width: 100%;
  padding: 13px;
  margin: 9px 0;
  border: 0;
  border-radius: 8px;
  font-size: 15px;
}

input, select {
  background: var(--white);
  color: #211821;
}

button {
  background: var(--gold);
  color: #211821;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.delete {
  background: #a33e59;
  color: white;
}

.muted, small { color: #d9cbd5; }

#message {
  padding: 12px 0;
  color: var(--pink);
  overflow-wrap: anywhere;
}

.hidden { display: none !important; }

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 15px;
}

.photo {
  background: var(--bg);
  padding: 10px;
  border-radius: 12px;
  min-width: 0;
}

.photo img {
  width: 100%;
  height: 190px;
  object-fit: cover;
  border-radius: 8px;
}

.photo p { overflow-wrap: anywhere; }

a { color: var(--pink); }

label {
  display: block;
  margin-top: 14px;
  color: var(--pink);
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.topbar button { width: auto; }

</style>
</head>

<body>
<main>

<h1>BREMOH BEAUTY GLOW</h1>
<p class="muted">Private photo management dashboard</p>

<!-- LOGIN -->
<section id="login" class="card">
  <h2>Administrator Login</h2>
  <p>Sign in with your authorised administrator account.</p>

  <form id="loginForm">
    <label for="email">Email address</label>
    <input
      id="email"
      type="email"
      placeholder="Administrator email"
      autocomplete="username"
      required
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
      required
    >

    <button id="loginButton" type="submit">SIGN IN</button>
  </form>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="hidden">

  <div class="card">
    <div class="topbar">
      <h2>Manage Beauty Photos</h2>
      <button id="logoutButton">SIGN OUT</button>
    </div>

    <p class="muted">
      Upload and manage photographs displayed in your public website gallery.
    </p>

    <form id="uploadForm">

      <label for="title">Photo title</label>
      <input
        id="title"
        type="text"
        placeholder="e.g. Soft glam makeup"
        required
      >

      <label for="category">Service category</label>
      <select id="category" required>
        <option value="">Choose category</option>
        <option>Manicure</option>
        <option>Pedicure</option>
        <option>Acrylic nails</option>
        <option>Gel nails</option>
        <option>Nail art</option>
        <option>Makeup</option>
        <option>Bridal makeup</option>
        <option>Lashes</option>
      </select>

      <label for="photo">Choose photograph</label>
      <input
        id="photo"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        required
      >

      <button id="uploadButton" type="submit">
        UPLOAD PHOTO
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
  </div>

  <div class="card">
    <div class="topbar">
      <h2>Uploaded Photos</h2>
      <button id="refreshButton">REFRESH</button>
    </div>

    <div id="photos" class="gallery">
      Loading photos...
    </div>
  </div>

</section>

<p class="muted">
  <a href="index.html">← Return to website</a>
</p>

</main>

<script>
"use strict";

/* SUPABASE CONFIGURATION */

const SUPABASE_URL =
  "https://iggcwyertbttnemgfrrs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_bjQ3_awUwHQP6eadXuMfhA_ojzEXZk";

const OWNER_ID =
  "89c67f6f-d65e-4919-8071-3aa9cb0ad14a";

const BUCKET = "beauty-gallery";
const TABLE = "gallery_photos";

/* INITIALISE SUPABASE */

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* PAGE ELEMENTS */

const loginSection = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");

const loginForm = document.getElementById("loginForm");
const uploadForm = document.getElementById("uploadForm");

function say(text) {
  message.textContent = text;
}

function showLogin() {
  loginSection.classList.remove("hidden");
  dashboard.classList.add("hidden");
}

function showDashboard() {
  loginSection.classList.add("hidden");
  dashboard.classList.remove("hidden");
}

/* ERROR HANDLING */

function errorText(error) {
  return error && error.message
    ? error.message
    : "An unexpected error occurred.";
}

/* CHECK ADMIN SESSION */

async function checkSession() {
  try {
    const { data, error } = await db.auth.getSession();

    if (error) throw error;

    const session = data.session;

    if (!session) {
      showLogin();
      return;
    }

    if (session.user.id !== OWNER_ID) {
      await db.auth.signOut();
      showLogin();
      say("This account is not authorised to manage this website.");
      return;
    }

    showDashboard();
    await loadPhotos();

  } catch (error) {
    showLogin();
    say("Session error: " + errorText(error));
  }
}

/* ADMIN LOGIN */

loginForm.addEventListener("submit", async function(e) {
  e.preventDefault();

  const button = document.getElementById("loginButton");

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  button.disabled = true;
  button.textContent = "SIGNING IN...";

  say("Connecting to Supabase...");

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) throw error;

    if (!data.user || data.user.id !== OWNER_ID) {
      await db.auth.signOut();

      say("This account is not authorised to access the dashboard.");
      return;
    }

    say("Login successful. Loading dashboard...");

    showDashboard();
    await loadPhotos();

  } catch (error) {
    say("LOGIN FAILED: " + errorText(error));

  } finally {
    button.disabled = false;
    button.textContent = "SIGN IN";
  }
});

/* SIGN OUT */

document.getElementById("logoutButton")
.addEventListener("click", async function() {

  try {
    const { error } = await db.auth.signOut();

    if (error) throw error;

    showLogin();
    say("You have signed out successfully.");

  } catch (error) {
    say("Sign out failed: " + errorText(error));
  }
});

/* LOAD PHOTOS */

async function loadPhotos() {

  const container = document.getElementById("photos");

  container.textContent = "Loading photos...";

  try {
    const { data, error } = await db
      .from(TABLE)
      .select("id,title,category,image_path,created_at")
      .order("created_at", { ascending: false });

    if (error) throw error;

    container.innerHTML = "";

    if (!data || data.length === 0) {
      container.textContent = "No photos uploaded yet.";
      return;
    }

    data.forEach(function(photo) {

      const { data: urlData } = db.storage
        .from(BUCKET)
        .getPublicUrl(photo.image_path);

      const item = document.createElement("article");
      item.className = "photo";

      const img = document.createElement("img");
      img.src = urlData.publicUrl;
      img.alt = photo.title || "Beauty photograph";
      img.loading = "lazy";

      const title = document.createElement("p");
      title.textContent = photo.title;

      const category = document.createElement("small");
      category.textContent = photo.category;

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete";
      deleteButton.textContent = "DELETE PHOTO";

      deleteButton.addEventListener("click", function() {
        deletePhoto(photo, deleteButton);
      });

      item.append(img, title, category, deleteButton);

      container.appendChild(item);
    });

  } catch (error) {
    container.textContent =
      "Could not load photos: " + errorText(error);
  }
}

/* UPLOAD PHOTO */

uploadForm.addEventListener("submit", async function(e) {

  e.preventDefault();

  const button = document.getElementById("uploadButton");

  const title = document.getElementById("title").value.trim();
  const category = document.getElementById("category").value;
  const file = document.getElementById("photo").files[0];

  if (!file) {
    say("Please choose a photograph.");
    return;
  }

  if (!title || !category) {
    say("Please enter a title and choose a category.");
    return;
  }

  if (file.size > 8 * 1024 * 1024) {
    say("Please choose an image smaller than 8 MB.");
    return;
  }

  const allowedTypes = [
    "image/jpeg",
    "image/png",
    "image/webp"
  ];

  if (!allowedTypes.includes(file.type)) {
    say("Only JPG, PNG and WebP images are allowed.");
    return;
  }

  button.disabled = true;
  button.textContent = "UPLOADING...";

  let uploadedPath = null;

  try {

    const { data: sessionData, error: sessionError } =
      await db.auth.getSession();

    if (sessionError) throw sessionError;

    if (!sessionData.session ||
        sessionData.session.user.id !== OWNER_ID) {
      throw new Error("Please sign in with the authorised administrator account.");
    }

    const safeName = file.name
      .toLowerCase()
      .replace(/[^a-z0-9.-]/g, "-");

    uploadedPath =
      Date.now() + "-" + crypto.randomUUID() + "-" + safeName;

    say("Uploading photograph...");

    const { error: uploadError } = await db.storage
      .from(BUCKET)
      .upload(uploadedPath, file, {
        contentType: file.type,
        upsert: false
      });

    if (uploadError) throw uploadError;

    say("Saving photograph details...");

    const { error: insertError } = await db
      .from(TABLE)
      .insert({
        title: title,
        category: category,
        image_path: uploadedPath
      });

    if (insertError) {
      await db.storage.from(BUCKET).remove([uploadedPath]);
      throw insertError;
    }

    say("SUCCESS! Your photograph has been uploaded.");

    uploadForm.reset();

    await loadPhotos();

  } catch (error) {

    say("UPLOAD FAILED: " + errorText(error));

  } finally {

    button.disabled = false;
    button.textContent = "UPLOAD PHOTO";
  }
});

/* DELETE PHOTO */

async function deletePhoto(photo, button) {

  const confirmed = confirm(
    "Are you sure you want to permanently delete this photograph?"
  );

  if (!confirmed) return;

  button.disabled = true;
  button.textContent = "DELETING...";

  try {

    const { data: sessionData, error: sessionError } =
      await db.auth.getSession();

    if (sessionError) throw sessionError;

    if (!sessionData.session ||
        sessionData.session.user.id !== OWNER_ID) {
      throw new Error("Administrator login required.");
    }

    const { error: storageError } = await db.storage
      .from(BUCKET)
      .remove([photo.image_path]);

    if (storageError) throw storageError;

    const { error: deleteError } = await db
      .from(TABLE)
      .delete()
      .eq("id", photo.id);

    if (deleteError) throw deleteError;

    say("Photograph deleted successfully.");

    await loadPhotos();

  } catch (error) {

    say("DELETE FAILED: " + errorText(error));

    button.disabled = false;
    button.textContent = "DELETE PHOTO";
  }
}

/* REFRESH GALLERY */

document.getElementById("refreshButton")
.addEventListener("click", loadPhotos);

/* START */

checkSession();

</script>
</body>
</html>
